<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin the Wheel Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <h1>🎉 Spin the Wheel! 🎉</h1>

        <!-- Group Management -->
        <div class="card group-controls">
            <div class="tab-buttons">
                <button type="button" class="tab-btn active" id="tab-people">People Group</button>
                <button type="button" class="tab-btn" id="tab-things">Things Group</button>
            </div>
            
            <!-- Registration Form -->
            <form id="item-form">
                <input type="text" id="item-name" placeholder="Name or Item" required>
                
                <label for="item-image-file" class="file-upload-btn">
                    📷 Choose Picture
                </label>
                <input type="file" id="item-image-file" accept="image/*" style="display: none;">
                
                <button type="submit" class="btn btn-add">Add to <span id="group-name-span">People</span></button>
            </form>
            <div id="file-chosen-text" class="file-chosen">No picture chosen</div>
        </div>

        <!-- Wheel and Winner Arena -->
        <div class="arena-card">
            <div class="wheel-container">
                <canvas id="wheelCanvas" width="380" height="380"></canvas>
                
                <!-- Large Center Winner Circle -->
                <div id="center-winner" class="center-circle">
                    <img id="center-img" src="" alt="" class="hidden">
                    <span id="center-text">SPIN</span>
                </div>
                <div class="marker"></div>
            </div>
            
            <div class="controls">
                <button type="button" id="spin-btn" class="btn btn-spin">SPIN WHEEL</button>
                <button type="button" id="reset-btn" class="btn btn-reset">Reset Group</button>
            </div>
        </div>

        <!-- Contender List with Edit/Delete Controls -->
        <div class="card list-card">
            <h3>Contenders in <span id="group-name-list">People</span></h3>
            <div id="contender-list" class="contender-small-list">
                <!-- Editable mini cards appear here -->
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Edit Contender</h3>
            <form id="edit-form">
                <input type="text" id="edit-name-input" required>
                <label for="edit-image-file" class="file-upload-btn">📷 Change Picture</label>
                <input type="file" id="edit-image-file" accept="image/*" style="display: none;">
                <div id="edit-file-text" class="file-chosen">Keep current picture</div>
                <div class="modal-buttons">
                    <button type="submit" class="btn btn-add">Save</button>
                    <button type="button" id="cancel-edit-btn" class="btn btn-reset">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="java.js"></script>
</body>
</html>
